name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64, stm32f103]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ make python3 xorriso

      - name: Install cross toolchains
        if: matrix.arch != 'x86_64'
        run: |
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            gcc-arm-none-eabi

      - name: Build (${{ matrix.arch }})
        run: |
          make ARCH=${{ matrix.arch }}
        timeout-minutes: 10

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make
      - name: Unit tests
        run: |
          make -f Makefile.test test
        timeout-minutes: 5

  boot:
    runs-on: ubuntu-latest
    needs: [build, unit]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc make python3 xorriso qemu-system-x86

      - name: Build + boot (x86_64)
        run: |
          make img-run &
          QEMU_PID=$!
          for i in $(seq 1 120); do
            sleep 1
            if grep -q "Entering idle loop" qemu_serial.log 2>/dev/null; then
              echo "OK: boot success"
              kill $QEMU_PID 2>/dev/null
              exit 0
            fi
            if grep -q "check_exception\|Triple fault" qemu_debug.log 2>/dev/null; then
              echo "CRASH detected"
              grep "check_exception\|Triple fault" qemu_debug.log
              kill $QEMU_PID 2>/dev/null
              exit 1
            fi
          done
          # Timeout: kill and check what we got
          kill $QEMU_PID 2>/dev/null || true
          wait $QEMU_PID 2>/dev/null || true
          if grep -q "Entering idle loop" qemu_serial.log 2>/dev/null; then
            echo "OK: boot success (late)"
          else
            echo "FAIL: timeout - no idle loop"
            tail -30 qemu_serial.log
            exit 1
          fi
        timeout-minutes: 10
