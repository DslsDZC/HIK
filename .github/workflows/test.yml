name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # 暂时屏蔽的架构（等移植完成后移除此变量即可恢复构建）
  DISABLED_ARCHS: "arm64 stm32f103"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64, stm32f103]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ make python3 xorriso

      - name: Install cross toolchains
        if: contains(env.DISABLED_ARCHS, matrix.arch) == false && matrix.arch != 'x86_64'
        run: |
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            gcc-arm-none-eabi

      - name: Skip (disabled arch)
        if: contains(env.DISABLED_ARCHS, matrix.arch)
        run: echo "Skipping ${{ matrix.arch }} — temporarily disabled"

      - name: Build
        if: contains(env.DISABLED_ARCHS, matrix.arch) == false
        run: make ARCH=${{ matrix.arch }}
        timeout-minutes: 10

  boot-x86_64:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc make python3 xorriso qemu-system-x86 gcc-mingw-w64-x86-64 mtools
      - name: Build + boot
        run: |
          make img-run &
          QPID=$!
          for i in $(seq 1 120); do
            sleep 1
            grep -q "Entering idle loop" qemu_serial.log 2>/dev/null && {
              echo "OK: boot success"; kill $QPID 2>/dev/null; exit 0
            }
            grep -q "check_exception\|Triple fault" qemu_debug.log 2>/dev/null && {
              echo "FAIL: crash"; grep "check_exception\|Triple fault" qemu_debug.log
              kill $QPID 2>/dev/null; exit 1
            }
          done
          kill $QPID 2>/dev/null; wait $QPID 2>/dev/null
          echo "FAIL: timeout"; exit 1
        timeout-minutes: 10
